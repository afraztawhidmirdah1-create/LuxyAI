<style>
:root{--bg:#0d0a18;--panel:#151128;--line:#2a2347;--tx:#efeaff;--mut:#9a90c4;--gold:#e8c46a;--gold2:#b98cff;--user:#2a2050}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:Roboto,"Noto Sans","Noto Sans Bengali","Noto Sans Devanagari","Segoe UI",Arial,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.serif{font-family:Georgia,"Times New Roman",serif}

/* Splash */
#splash{position:fixed;inset:0;z-index:99;background:radial-gradient(circle at 50% 40%,#241a4a,#0d0a18 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s,transform .8s}
#splash.out{opacity:0;transform:scale(1.08);pointer-events:none}
.orb{position:relative;width:150px;height:150px;margin-bottom:34px}
.orb i{position:absolute;inset:0;border-radius:50%;border:2px solid transparent;border-top-color:var(--gold);animation:spin 2.4s linear infinite}
.orb i:nth-child(2){inset:14px;border-top-color:var(--gold2);animation-duration:1.8s;animation-direction:reverse}
.orb i:nth-child(3){inset:28px;border-top-color:#fff;animation-duration:1.2s}
.orb b{position:absolute;inset:44px;border-radius:50%;background:conic-gradient(var(--gold),var(--gold2),var(--gold));filter:blur(.5px);animation:pulse 1.8s ease-in-out infinite;box-shadow:0 0 60px 10px rgba(185,140,255,.45)}
.orb em{position:absolute;inset:0;display:grid;place-items:center;font:700 38px Georgia,serif;color:#1a1033;font-style:normal;z-index:2}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.12);box-shadow:0 0 90px 22px rgba(232,196,106,.45)}}
.word{font:700 54px/1 Georgia,serif;letter-spacing:.06em;display:flex;gap:2px}
.word span{opacity:0;transform:translateY(30px) scale(.6);filter:blur(8px);background:linear-gradient(180deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise .7s cubic-bezier(.2,.9,.3,1.3) forwards}
@keyframes rise{to{opacity:1;transform:none;filter:none}}
.by{margin-top:22px;font-size:14px;letter-spacing:.28em;color:var(--mut);opacity:0;animation:fade 1s 1.6s forwards;position:relative;overflow:hidden;padding:4px 10px}
.by::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-120%);animation:sheen 1.4s 2.4s forwards}
@keyframes fade{to{opacity:1}}
@keyframes sheen{to{transform:translateX(120%)}}
.spark{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--gold);opacity:0;animation:float 4s infinite}
@keyframes float{0%{opacity:0;transform:translateY(40px)}30%{opacity:.9}100%{opacity:0;transform:translateY(-160px)}}

/* Layout */
#app{display:flex;height:100%;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#side{width:290px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;transition:transform .3s;z-index:20}
#side h2{margin:0;padding:18px 18px 8px;font:700 22px Georgia,serif;color:var(--gold)}
#side small{padding:0 18px 12px;color:var(--mut);font-size:12px}
#newchat{margin:6px 14px 12px;padding:12px;border-radius:14px;background:linear-gradient(135deg,var(--gold),#d49af0);color:#1a1033;font-weight:700}
#list{flex:1;overflow:auto;padding:0 10px}
.item{display:flex;align-items:center;gap:6px;padding:11px 12px;border-radius:12px;color:var(--mut);cursor:pointer;font-size:14px}
.item span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item.on,.item:hover{background:var(--user);color:var(--tx)}
.item button{opacity:.6;font-size:16px;padding:2px 6px}
.sfoot{padding:12px 14px;border-top:1px solid var(--line);display:flex;gap:8px}
.sfoot button{flex:1;padding:10px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:13px}
#scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:15}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
header .t{font:700 20px Georgia,serif;flex:1}
header .t small{display:block;font:400 11px system-ui;color:var(--mut)}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:var(--panel);border:1px solid var(--line)}
#menu{display:none}
#chat{flex:1;overflow:auto;padding:18px 14px;scroll-behavior:smooth}
.wrap{max-width:780px;margin:0 auto}
.msg{display:flex;margin-bottom:16px;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.msg.user{justify-content:flex-end}
.bub{max-width:88%;padding:12px 15px;border-radius:18px;line-height:1.55;font-size:15px;overflow-wrap:anywhere}
.user .bub{background:var(--user);border-bottom-right-radius:5px}
.model .bub{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:5px}
.bub img{max-width:100%;max-height:240px;border-radius:12px;display:block;margin-bottom:8px}
.bub p{margin:6px 0}.bub p:first-child{margin-top:0}.bub p:last-child{margin-bottom:0}.bub h4{margin:12px 0 4px;color:var(--gold);font-size:15px}.bub ol{padding-left:22px;margin:6px 0}.bub li{margin:3px 0}
.bub table{border-collapse:collapse;width:100%;font-size:13px;margin:8px 0;display:block;overflow-x:auto}.bub th,.bub td{border:1px solid var(--line);padding:6px 9px;text-align:left}.bub th{background:var(--user)}
.bub pre{background:#0a0714;border:1px solid var(--line);border-radius:12px;padding:12px;overflow:auto;font-size:13px;margin:8px 0;position:relative}
.bub code{font-family:ui-monospace,Menlo,Consolas,monospace}
.bub p code,.bub li code{background:#0a0714;padding:2px 6px;border-radius:6px;font-size:13px}
.bub ul{padding-left:20px;margin:6px 0}
.chip-file{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-size:12px;margin-bottom:6px}
.dots span{display:inline-block;width:8px;height:8px;margin:0 2px;border-radius:50%;background:var(--gold);animation:bn 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes bn{50%{transform:translateY(-6px);opacity:.4}}
#hero{text-align:center;padding:7vh 10px 10px}
#brief{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;margin:0 0 14px;font-size:14px;line-height:1.5}#brief b{color:var(--gold)}#brief .w{margin:4px 0 8px;color:var(--mut)}#brief a{color:var(--tx);text-decoration:none;display:block;padding:7px 0;border-top:1px solid var(--line)}
#hero h1{font:700 40px Georgia,serif;margin:0 0 6px;background:linear-gradient(90deg,var(--gold),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
#hero p{color:var(--mut);margin:0 0 24px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid button{text-align:left;padding:14px;border-radius:16px;background:var(--panel);border:1px solid var(--line);font-size:14px;line-height:1.35}
.grid button b{display:block;font-size:20px;margin-bottom:4px}
.grid button:active{transform:scale(.97);border-color:var(--gold)}

/* Composer */
#comp{padding:10px 12px 12px}
#prev{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.pv{position:relative;flex:none}
.pv img{width:64px;height:64px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.pv .f{width:64px;height:64px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-size:11px;padding:4px;text-align:center;overflow:hidden}
.pv button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:#ff6b8a;color:#fff;font-size:12px}
.bar{display:flex;align-items:flex-end;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:6px;max-width:780px;margin:0 auto}
.bar:focus-within{border-color:var(--gold)}
textarea{flex:1;resize:none;background:none;border:0;outline:0;color:var(--tx);font:15px/1.4 Roboto,"Noto Sans","Noto Sans Bengali","Noto Sans Devanagari",Arial,sans-serif;padding:10px 4px;max-height:140px}
.bar .ib{border:0;background:var(--bg);border-radius:50%;flex:none}
#send{background:linear-gradient(135deg,var(--gold),#d49af0);color:#1a1033;font-weight:700}
#attmenu{display:none;position:absolute;bottom:78px;left:16px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px;z-index:10;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#attmenu button{display:block;width:100%;text-align:left;padding:12px 18px;border-radius:10px;white-space:nowrap}
#attmenu button:hover{background:var(--user)}
.hint{text-align:center;font-size:11px;color:var(--mut);margin-top:6px}

/* Settings */
#set{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.65);align-items:center;justify-content:center;padding:18px}
#set .card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px;width:100%;max-width:440px}
#set h3{margin:0 0 4px;font:700 22px Georgia,serif;color:var(--gold)}
#set label{display:block;font-size:13px;color:var(--mut);margin:14px 0 6px}
#set input,#set textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px;color:var(--tx);font:14px system-ui}
#set textarea{height:80px}
#set .row{display:flex;gap:10px;margin-top:18px}
#set .row button{flex:1;padding:12px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
#set .row .pri{background:linear-gradient(135deg,var(--gold),#d49af0);color:#1a1033;font-weight:700;border:0}
#set a{color:var(--gold2)}

#set .card{max-height:90vh;overflow:auto}
.act{display:flex;gap:6px;margin-top:8px}.act button{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:5px 11px;font-size:14px}
.gen{margin-top:8px}.gen>img{width:100%;border-radius:14px;display:block}
.vbox{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:14px;background:#000}.vbox img{width:100%;height:100%;object-fit:cover;display:block}
.vbox .cap{position:absolute;left:0;right:0;bottom:0;padding:10px 12px;background:linear-gradient(transparent,rgba(0,0,0,.75));font-size:14px;text-align:center}
@keyframes kb{from{transform:scale(1);opacity:.4}10%{opacity:1}to{transform:scale(1.12);opacity:1}}
#mic.rec{background:#ff6b8a;color:#fff}
#acctbox{margin-top:6px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--bg)}
#acctbox .who{display:flex;align-items:center;gap:10px;margin-bottom:8px}#acctbox .who img,#acctbox .who span{width:40px;height:40px;border-radius:50%;object-fit:cover;font-size:22px;display:grid;place-items:center}
#acctbox .arow{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}#acctbox .arow button{flex:1;min-width:120px;padding:10px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:13px}
#set select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px;color:var(--tx);font:14px sans-serif}
.ota{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:60;background:linear-gradient(135deg,var(--gold),#d49af0);color:#1a1033;font-weight:700;padding:14px;border-radius:14px;text-align:center}

.zt{font:700 19px Georgia,serif;color:var(--gold);margin-bottom:8px}.zs{font-size:12px;color:var(--mut);margin-top:6px}
.zp{background:#fffdf5;border-radius:12px;padding:8px;margin-bottom:12px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.zp.zcv{display:block;padding:0;background:none}.zp:not(.zcv) .zn:first-child:nth-last-child(odd){grid-column:1/-1}
.zn{position:relative;overflow:hidden;border:2px solid #111;border-radius:4px;background:#000}
.zn img,.zcv img{width:100%;max-height:none;margin:0;border-radius:0;display:block;min-height:110px}.zcv img{border-radius:12px}
img.zld{background:linear-gradient(110deg,#1c1638 8%,#2a2250 18%,#1c1638 33%);background-size:200% 100%;animation:zsh 1.2s linear infinite}@keyframes zsh{to{background-position:-200% 0}}
.zcap{position:absolute;top:0;left:0;right:0;background:#ffe27a;color:#111;font-size:11px;padding:3px 6px}
.zsp{position:absolute;bottom:6px;left:6px;right:6px;display:flex;flex-direction:column;gap:3px}
.zsp span{background:#fff;color:#111;border-radius:12px;padding:3px 9px;font-size:11px;max-width:92%;align-self:flex-start}.zsp span:nth-child(2){align-self:flex-end}
.zv{position:relative;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
.bub .zv img{position:absolute;inset:0;width:100%;height:100%;max-height:none;margin:0;border-radius:0;object-fit:cover;opacity:0;transition:opacity 1s}
.bub .zv img.on{opacity:1;animation:zkb linear forwards}@keyframes zkb{to{transform:scale(1.14)}}
.zsub{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.85));padding:22px 10px 8px;font-size:12px;color:#fff;max-height:60%;overflow:hidden}
.zbar{display:flex;align-items:center;gap:8px;margin-top:8px}.zbar button{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 14px;font-size:15px;color:var(--tx)}.zbar span{font-size:12px;color:var(--mut)}

#gate{position:fixed;inset:0;z-index:98;background:radial-gradient(circle at 50% 30%,#241a4a,#0d0a18 70%);display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;overflow:auto}
#gate .gl{font:700 44px Georgia,serif;background:linear-gradient(90deg,var(--gold),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
#gate h2{margin:6px 0 4px;font:600 20px Georgia,serif;text-align:center}#gate p{color:var(--mut);text-align:center;max-width:340px;margin:0 0 22px;font-size:14px}
#gate .gb{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px}
#gate button.pv2{padding:14px;border-radius:16px;background:var(--panel);border:1px solid var(--line);font-size:15px;font-weight:600}
#gate button.pv2:active{transform:scale(.97);border-color:var(--gold)}
#gate input{width:100%;padding:14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);color:var(--tx);font-size:15px}
#gate .gm{color:#ff9bb0;font-size:13px;min-height:18px;text-align:center;max-width:340px;margin-top:10px}
#gate .gz{display:flex;gap:8px;margin-top:22px}#gate .gz button{padding:6px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:13px}
#boost{display:none;margin:8px 12px 0;padding:10px 12px;border:1px solid var(--gold);border-radius:14px;background:var(--panel);font-size:13px;align-items:center;gap:8px;flex-wrap:wrap}#boost button{padding:6px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);color:var(--tx);font-size:13px}
@media(max-width:820px){
 #side{position:fixed;inset:0 auto 0 0;transform:translateX(-100%);padding-top:env(safe-area-inset-top)}
 #side.open{transform:none}#side.open~#scrim{display:block}
 #menu{display:grid}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
/* ===== themes + special design ===== */
:root{--user2:#3a2a78}
html[data-theme=aurora]{--bg:#06141a;--panel:#0d2229;--line:#1b4650;--tx:#e8fbff;--mut:#7fb6c4;--gold:#5ef2c9;--gold2:#6aa8ff;--user:#134a55;--user2:#1f6a78}
html[data-theme=sunrise]{--bg:#fff7ee;--panel:#ffffff;--line:#f1d9c4;--tx:#2a1a12;--mut:#8a6a56;--gold:#e0662a;--gold2:#c43c7a;--user:#ffe3cf;--user2:#ffd0b0}
#main{position:relative}
#main::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.5;background:radial-gradient(60% 40% at 15% 10%,color-mix(in srgb,var(--gold2) 35%,transparent),transparent 70%),radial-gradient(50% 40% at 90% 30%,color-mix(in srgb,var(--gold) 28%,transparent),transparent 70%),radial-gradient(60% 40% at 50% 100%,color-mix(in srgb,var(--gold2) 25%,transparent),transparent 70%);background-size:140% 140%;animation:aur 16s ease-in-out infinite alternate}
@keyframes aur{from{background-position:0 0}to{background-position:100% 60%}}
header,#chat,#comp{position:relative;z-index:1}
header{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 72%,transparent)}
header .t{background:linear-gradient(90deg,var(--gold),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
header .t small{-webkit-text-fill-color:var(--mut)}
.user .bub{background:linear-gradient(135deg,var(--user),var(--user2))}
.model .bub{box-shadow:0 8px 28px rgba(0,0,0,.16)}
.bar{box-shadow:0 8px 30px rgba(0,0,0,.2)}
.orb.s{transform:scale(.6);margin:-30px auto -30px}
#gate .orb.s{margin:-20px auto -14px}
#gate .big{display:flex;flex-direction:column;gap:4px;text-align:left;padding:16px 18px}
#gate .big span{font-size:16px;font-weight:700}#gate .big small{color:var(--mut);font-weight:400;font-size:12px;line-height:1.4}
#gate .gz button{color:var(--tx)}
#tagl{height:24px;margin:2px 0 6px;color:var(--gold);font-weight:600;letter-spacing:.02em;transition:opacity .35s}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 14px}
.strip button{padding:14px 6px;border-radius:18px;color:#1a1033;font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 8px 22px rgba(0,0,0,.25);transition:transform .15s}
.strip button:active{transform:scale(.95)}
.strip button b{font-size:24px}
.strip button:nth-child(1){background:linear-gradient(135deg,#ffd86b,#ff9d6b)}
.strip button:nth-child(2){background:linear-gradient(135deg,#9ad0ff,#b98cff)}
.strip button:nth-child(3){background:linear-gradient(135deg,#8af0c5,#6ac4ff)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips button{padding:7px 12px;border-radius:999px;background:var(--bg);border:1px solid var(--gold);color:var(--tx);font-size:13px;line-height:1.3;text-align:left}
.chips button:active{background:var(--user)}
#msheet{display:none;position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.65);align-items:center;justify-content:center;padding:18px}#msheet .card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:20px;width:100%;max-width:400px;max-height:88vh;overflow:auto}#msheet h3{margin:0 0 12px}#msheet .mrow{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;padding:12px 14px;margin-bottom:8px;border-radius:14px;background:var(--bg);border:1px solid var(--line);color:var(--tx);text-align:left}#msheet .mrow small{color:var(--mut);font-size:12px}#msheet .mrow.on{border-color:var(--gold);background:var(--panel)}#mdl{flex:none;padding:6px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:12px;font-weight:600;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx)}
#modes{display:flex;gap:6px;overflow-x:auto;max-width:780px;margin:0 auto;padding:0 2px 8px;scrollbar-width:none}
#modes::-webkit-scrollbar{display:none}
#modes button{flex:none;padding:6px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:13px;white-space:nowrap}
#modes button.on{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1033;border-color:transparent;font-weight:700}
.vbox canvas{width:100%;height:100%;display:block}
.vbox .vtime{position:absolute;top:8px;right:10px;font-size:12px;background:rgba(0,0,0,.55);color:#fff;border-radius:8px;padding:2px 8px}
#set select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px;color:var(--tx);font:14px Roboto,Arial,sans-serif}
#set .arow{display:flex;gap:8px;margin:8px 0}#set .arow button{flex:1;padding:10px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:13px;color:var(--tx)}
</style>

async function weather(p){

async function llm(messages,onChunk,model,ce,ext){
  if(FREE[model]){const F=FREE[model];ce={url:F.url,key:F.key};model=await pickModel(F,model)}
  const c=new AbortController();let id=setTimeout(()=>c.abort(),8000);
  if(ext){if(ext.signal.aborted)c.abort();else ext.signal.addEventListener('abort',()=>c.abort())}
  try{
    const hd={'Content-Type':'application/json'};if(ce&&ce.key)hd.Authorization='Bearer '+ce.key;
    const url=ce&&ce.url?(/\/chat\/completions$/.test(ce.url)?ce.url:ce.url.replace(/\/+$/,'')+'/chat/completions'):'https://text.pollinations.ai/openai';
    const r=await fetch(url,{method:'POST',headers:hd,body:JSON.stringify({model:model||'openai',messages,stream:true}),signal:c.signal});
    if(!r.ok){let em='';try{em=(await r.text()).slice(0,200)}catch(e){}throw new Error('HTTP '+r.status+' '+em)}
    const rd=r.body&&r.body.getReader?r.body.getReader():null,dec=new TextDecoder();let raw='',buf='',out='';
    if(!rd){raw=await r.text()}else for(;;){
      const x=await rd.read();if(x.done)break;clearTimeout(id);id=setTimeout(()=>c.abort(),20000);
      const ch=dec.decode(x.value,{stream:true});raw+=ch;buf+=ch;const lines=buf.split('\n');buf=lines.pop();
      for(const ln of lines){const s=ln.trim();if(s.slice(0,5)!=='data:')continue;const d=s.slice(5).trim();if(d==='[DONE]')continue;
        try{const j=JSON.parse(d),o=j.choices&&j.choices[0],t=o&&((o.delta&&o.delta.content)||(o.message&&o.message.content))||'';if(t){out+=t;if(onChunk)onChunk(out)}}catch(e){}}
    }
    if(!out.trim()){try{const j=JSON.parse(raw);out=j.choices[0].message.content||''}catch(e){}}
    if(!out.trim())throw new Error('empty');
    return out;
  }finally{clearTimeout(id)}
}

const mapS=(s,M)=>s&&[...s].every(c=>M[c])?[...s].map(c=>M[c]).join(''):null;
function sym(t){
  if(!/[\\^_]/.test(t)||/https?:/.test(t))return t;
  if(/\\[a-zA-Z(\[]/.test(t)){
    t=t.replace(/\$\$?|\\\(|\\\)|\\\[|\\\]/g,'');
    for(let i=0;i<3;i++)t=t.replace(/\\[dt]?frac\{([^{}]*)\}\{([^{}]*)\}/g,(m,a,b)=>(/^[\w.]+$/.test(a)?a:'('+a+')')+'/'+(/^[\w.]+$/.test(b)?b:'('+b+')'));
    t=t.replace(/\\sqrt\{([^{}]*)\}/g,'√($1)').replace(/\\(?:text|mathrm|mathbf|operatorname)\{([^{}]*)\}/g,'$1').replace(/\\(?:vec|overrightarrow)\{([^{}]*)\}/g,'$1\u20D7')
     .replace(/\\times/g,'×').replace(/\\cdot/g,'·').replace(/\\div/g,'÷').replace(/\\approx/g,'≈').replace(/\\neq/g,'≠').replace(/\\leq?/g,'≤').replace(/\\geq?/g,'≥').replace(/\\pm/g,'±').replace(/\\rightarrow|\\to/g,'→').replace(/\\infty/g,'∞').replace(/\\circ/g,'°').replace(/\\(?:left|right)/g,'').replace(/\\[,;! ]/g,' ')
     .replace(/\\([A-Za-z]+)/g,(m,n)=>GR[n]||m);
  }
  t=t.replace(/\^\{([^{}]*)\}|\^([-−+]?\d+)/g,(m,a,b)=>mapS(a||b,SUP)||m);
  t=t.replace(/([A-Za-zα-ωΑ-Ω)])(?:_\{([^{}]*)\}|_(\d+))/g,(m,a,b,c)=>{const r=mapS(b||c,SUB);return r?a+r:m});
  return t;
}
function md(t){
  t=splitSug(t).t;const parts=t.split(/```/);
  const inl=s=>s.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/(^|[\s(])\*([^*\s][^*\n]*?)\*(?=[\s).,!?:;]|$)/g,'$1<i>$2</i>').replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener" style="color:var(--gold2)">$1</a>');
  const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
  const isRow=l=>/^\s*\|.*\|\s*$/.test(l),isSep=l=>/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);

  return parts.map((p,i)=>{
    if(i%2){const nl=p.indexOf('\n');return '<pre><code>'+esc(p.slice(nl+1).replace(/\n$/,''))+'</code></pre>'}
    const L=esc(sym(p)).split('\n');let o='',k=0,m;
    while(k<L.length){
      const ln=L[k];
      if(isRow(ln)&&k+1<L.length&&isSep(L[k+1])){const hd=cells(ln),rows=[];k+=2;while(k<L.length&&isRow(L[k])){rows.push(cells(L[k]));k++}
        o+='<table><thead><tr>'+hd.map(c=>'<th>'+inl(c)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+inl(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';continue}
      if(m=ln.match(/^#{1,4}\s+(.+)$/)){o+='<h4>'+inl(m[1])+'</h4>';k++;continue}
      if(UL.test(ln)){const it=[];while(k<L.length&&UL.test(L[k])){it.push(L[k].replace(UL,''));k++}o+='<ul>'+it.map(x=>'<li>'+inl(x)+'</li>').join('')+'</ul>';continue}
      if(OL.test(ln)){const it=[];while(k<L.length&&OL.test(L[k])){it.push(L[k].replace(OL,''));k++}o+='<ol>'+it.map(x=>'<li>'+inl(x)+'</li>').join('')+'</ol>';continue}
      if(!ln.trim()){k++;continue}
      const para=[];while(k<L.length&&L[k].trim()&&!/^(#{1,4}\s)/.test(L[k])&&!UL.test(L[k])&&!OL.test(L[k])&&!(isRow(L[k])&&k+1<L.length&&isSep(L[k+1]))){para.push(L[k]);k++}
      if(!para.length){para.push(L[k]);k++}
      o+='<p>'+para.map(inl).join('<br>')+'</p>';
    }
    return o;
  }).join('');
}

const inp=$('#inp');

async function send(){
  if(busy)return;
  document.querySelectorAll('.chips').forEach(e=>e.remove());
  const text=inp.value.trim();
  if(!text&&!pend.length)return;
  if(!cur){cur={id:Date.now()+'',t:Date.now(),title:(text||'Image chat').slice(0,40),m:[]};chats.push(cur)}
  let full=text;pend.filter(a=>a.text).forEach(a=>full+='\n\n[File: '+a.name+']\n'+a.text);
  const um={r:'user',t:text||(pend.some(a=>a.img)?'What is in this picture?':'Please look at the attached file.'),imgs:pend.filter(a=>a.img).map(a=>a.img),files:pend.filter(a=>a.name).map(a=>a.name),ctx:full||undefined};
  if(!text&&!full.trim())um.ctx=um.t;
  cur.m.push(um);cur.t=Date.now();
  pend=[];renderPrev();inp.value='';inp.style.height='auto';
  if(cur.m.length===1)renderChat();else addMsg(um);
  renderList();
  const th=addMsg({r:'model',t:''});th.querySelector('.bub').innerHTML='<div class="dots"><span></span><span></span><span></span></div>';scrollEnd();
  busy=true;const bub=th.querySelector('.bub');
  let r;try{r=await think(um,t=>{bub.innerHTML=md(t);scrollEnd()})}catch(e){r={t:LC.reply(um),s:[]}}
  const out0=(r.t||LC.reply(um))+(window.__eng?'\n\n⚠ '+window.__eng:'');window.__eng='';const sp=splitSug(out0),out=sp.t;
  cur.m.push({r:'model',t:out,gen:r.gen,sug:sp.s});bub.innerHTML=md(out);
  addActs(th,out);addChips(bub,sp.s);
  if(cfg.auto)speak(out,detect(out)||lang);
  busy=false;save();renderList();scrollEnd();syncSoon();
}

let voices=[];const loadVoices=()=>{try{voices=speechSynthesis.getVoices()||[]}catch(e){}};

const FEM=/female|woman|zira|samantha|susan|hazel|heera|kalpana|aria|jenny|libby|sonia|tessa|karen|moira|victoria|veena|swara|neerja|nabanita|tanishaa|google.*(hindi|bangla|bengali)/i;
const MALE=/(^|\W)male|david|mark|daniel|alex|james|george|ravi|hemant|prabhat|bashkar|pradeep|guy|ryan|christopher|eric|madhur/i;
function speak(t,l){
  if(!('speechSynthesis' in window))return;speechSynthesis.cancel();
  t=String(t).replace(/```[\s\S]*?```/g,' ').replace(/\[([^\]]+)\]\([^)]*\)/g,'$1').replace(/[*_`#>]/g,'').replace(/[\u{1F300}-\u{1FAFF}\u2600-\u27BF]/gu,'').trim();if(!t)return;
  const loc={en:'en-US',bn:'bn-BD',hi:'hi-IN'}[l||lang]||'en-US',male=cfg.voice==='male';
  const pool=voices.filter(v=>v.lang.replace('_','-').toLowerCase().startsWith(loc.slice(0,2)));
  const want=male?MALE:FEM,other=male?FEM:MALE;
  const hit=pool.find(x=>want.test(x.name)),v=hit||pool.find(x=>!other.test(x.name))||pool[0];
  (t.match(/[^.!?\u0964\n]{1,200}[.!?\u0964]?/g)||[t]).forEach(s=>{
    if(!s.trim())return;const u=new SpeechSynthesisUtterance(s.trim());u.lang=loc;if(v)u.voice=v;

}

let tagT;
function heroInit(){
  const s=document.querySelector('#hero .strip');if(!s)return;
  CRT[lang].forEach(([e,n,p])=>{const b=document.createElement('button');b.innerHTML='<b>'+e+'</b><span>'+n+'</span>';b.onclick=()=>{inp.value=p;inp.focus();inp.oninput&&inp.oninput()};s.appendChild(b)});
  const tg=document.querySelector('#tagl'),L=TAGS[lang];let k=0;
  const step=()=>{if(!document.body.contains(tg)){clearInterval(tagT);return}tg.style.opacity=0;setTimeout(()=>{tg.textContent=L[k++%L.length];tg.style.opacity=1},350)};
  step();clearInterval(tagT);tagT=setInterval(step,2800);
}

function otaBanner(){const d=document.createElement('div');d.className='ota';d.textContent=GM[lang].upd;d.onclick=()=>location.reload();document.body.appendChild(d)}
async function otaCheck(){
  try{localStorage.setItem('luxy_ota_ok','1')}catch(e){}
  if(!OTA_ENABLED||UPDATE_URL.indexOf('YOUR-USER')>-1)return;
  const d=new Date().toISOString().slice(0,10);if(ls.get('luxy_otaday','')===d)return;
  try{
    const r=await fetch(UPDATE_URL+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const t=await r.text();ls.set('luxy_otaday',d);
    const v=+((t.match(/name="luxy-version" content="(\d+)"/)||[])[1]||0);
    if(v>APP_VER&&v>(+localStorage.getItem('luxy_ota_ver')||0)&&t.length>20000&&t.indexOf('</html>')>0&&t.indexOf('Luxy AI')>0){localStorage.setItem('luxy_ota',t);localStorage.setItem('luxy_ota_ver',String(v));otaBanner()}
  }catch(e){}
}
